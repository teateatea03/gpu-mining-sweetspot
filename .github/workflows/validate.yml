name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sweetspot.py --config examples/config.example.json --plan examples/plan.example.json --validate-only
      - run: python scripts/analyze.py --input examples/measurements.json --output analysis/demo
